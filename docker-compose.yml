services:
  app:
    build: .
    ports:
      - 8000:8000
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: technical_test
      DB_USERNAME: root
      DB_PASSWORD: root
    command: sh -c "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: technical_test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data: